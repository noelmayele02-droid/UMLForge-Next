name: UMLForge Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UMLForge/UMLForge.sln
      - name: Build Release
        run: dotnet build UMLForge/UMLForge.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test UMLForge/UMLForge.sln --configuration Release --no-build --logger "console;verbosity=normal"
